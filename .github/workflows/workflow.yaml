name: Build Jenkins attack framework Executable
on:
  workflow_dispatch: # This allows manual triggering
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install jenkins attack framework and dependencies
        run: |
          chmod +x jaf
          sudo ./jaf --install          # Install adidnsdump and its dependencies
          # Install PyInstaller
          pip install pyinstaller
          
      - name: Build executable
        run: |
          # Create a simple entry point script
          # Use this entry script for PyInstaller
          pyinstaller --onefile --additional-hooks-dir=. --name jaf_debian_amd64.exe jaf_launcher.py
                   
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaf_debian_amd64
          path: dist/jaf_debian_amd64.exe
